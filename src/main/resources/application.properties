spring.application.name=MLDIS Hospital Management
server.port=${PORT:8080}
# Default profile uses H2 so the project runs immediately. Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:file:./data/mldisdb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.fail-on-empty-beans=false
